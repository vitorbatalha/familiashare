name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Formatação (gofmt)
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host "Rode gofmt -w nestes arquivos:"; $files; exit 1 }

      - name: go vet
        # -unsafeptr=false: chamadas ao Windows convertem uintptr em ponteiro de propósito
        run: go vet -unsafeptr=false ./...

      - name: Testes
        run: go test -race ./...

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Dev

      - uses: actions/upload-artifact@v4
        with:
          name: familiashare-dev
          path: dist/familiashare.exe
          retention-days: 14
