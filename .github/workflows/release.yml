# Publica uma versão: ao enviar uma tag v0.x.y, compila o .exe e cria o Release com as
# notas da versão tiradas do CHANGELOG.md. O app dos amigos encontra o release novo
# sozinho (ver internal/update).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Testes
        run: go test ./...

      - name: Notas da versão (CHANGELOG.md)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($v))\]" })
          if ($start -lt 0) { throw "CHANGELOG.md não tem a seção [$v]" }
          $notes = @()
          for ($i = $start + 1; $i -lt $lines.Length -and $lines[$i] -notmatch '^## \[' -and $lines[$i] -notmatch '^\[.+\]: '; $i++) { $notes += $lines[$i] }
          ($notes -join "`n").Trim() | Set-Content notes.md -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build.ps1 -Version $v

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/familiashare.exe --title "familiashare ${{ github.ref_name }}" --notes-file notes.md
